<div class="progress-bar-container">
  <span class="timestamp">{{ formatTime(currentTime) }}</span>
  
  <input 
    type="range" 
    class="progress-slider" 
    [value]="currentTime"
    min="0"
    [max]="duration || 0"
    step="0.1"
    (change)="onSeek($event)">

  <span class="timestamp">{{ formatTime(duration) }}</span>
  
</div>
