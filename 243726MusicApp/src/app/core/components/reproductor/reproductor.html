<audio 
  #audioPlayer
  [src]="currentTrack?.preview_url"
  (timeupdate)="onTimeUpdate()"
  (loadedmetadata)="onLoadedMetadata()"
  (ended)="onEnded()"> </audio>>
</audio>

<div class="deploy-tab" [hidden]="isPlayerVisible" (click)="showPlayer()">
  <img src="/Assets/Music.png" alt="Mostrar" class="deploy-icon">
</div>

<aside class="player-container" [class.hidden]="!isPlayerVisible">

  <div class="player-main-content">

    <div class="player-header">
      <img src="/Assets/Back Arrow.png" alt="Ocultar" class="header-icon" (click)="hidePlayer()">
    </div>

    <app-image-reproductor 
      [imageUrl]="cardImageUrl"
      [title]="cardTitle"
      [artist]="cardArtist">
    </app-image-reproductor>
    <app-progres-bar
      [currentTime]="currentTime"
      [duration]="duration"
      (seek)="onSeek($event)">
    </app-progres-bar>

    <div class="playback-controls">
      <img src="/Assets/End.png" alt="Anterior" class="control-icon" (click)="playPrevious()">
      
      <img 
        [src]="isPlaying ? '/Assets/play3.png' : '/Assets/play.png'" 
        alt="Play/Pause" 
        class="control-icon play-icon"
        (click)="togglePlayPause()">
      
      <img src="/Assets/next.png" alt="Siguiente" class="control-icon" (click)="playNext()">
    </div>
  </div>

  <div class="divider"></div>

  <div class="player-playlist-area">
    <app-playlist></app-playlist>
  </div>

</aside>
